<section class="section skills-section" id="skills">
  <div class="section-inner">
    <div class="section-header">
      <span class="section-label">Tech Stack</span>
      <h2 class="section-title">Core Expertise</h2>
      <!-- <p class="section-desc">Interactive 3D floating grid of technologies &amp; platforms</p> -->
    </div>

    <div
      class="skills-orbit"
      (mousemove)="onOrbitMove($event)"
      (mouseleave)="onOrbitLeave()"
      [style.transform]="orbitTransform"
    >
      <div
        class="skill-cluster"
        *ngFor="let cluster of skillClusters; let ci = index"
        [style.--cluster-index]="ci"
      >
        <div class="cluster-header">
          <div class="cluster-icon">
            <i [class]="cluster.icon"></i>
          </div>
          <h3>{{ cluster.title }}</h3>
        </div>
        <div class="skill-pills">
          <span
            class="skill-pill"
            *ngFor="let skill of cluster.skills; let si = index"
            [style.--pill-delay]="si * 0.05 + 's'"
            (mouseenter)="hoveredSkill = skill"
            (mouseleave)="hoveredSkill = ''"
            [class.pill-active]="hoveredSkill === skill"
          >
            {{ skill }}
          </span>
        </div>
      </div>
    </div>

    <div class="skills-particles">
      <span class="particle-tag" *ngFor="let tag of floatingTags" [style.left.%]="tag.x" [style.top.%]="tag.y" [style.animation-delay]="tag.delay">{{ tag.label }}</span>
    </div>
  </div>
</section>
