<section class="section projects-section" id="project">
  <div class="section-inner">
    <div class="section-header">
      <span class="section-label">Featured Work</span>
      <h2 class="section-title">Project Showcase</h2>
      <!-- <p class="section-desc">3D interactive flip cards — hover to reveal architecture details</p> -->
    </div>

    <div class="project-carousel">
      <div
        class="flip-card"
        *ngFor="let project of projects; let i = index"
        (mouseenter)="activeProject = i"
        (mouseleave)="activeProject = -1"
        [class.card-flipped]="activeProject === i"
      >
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <div class="card-icon">
              <i [class]="project.icon"></i>
            </div>
            <h3>{{ project.title }}</h3>
            <p class="card-subtitle">{{ project.subtitle }}</p>
            <span class="flip-hint">Hover to explore</span>
          </div>
          <div class="flip-card-back">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <div class="card-tech">
              <span *ngFor="let tech of project.tech">{{ tech }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="carousel-nav">
      <button class="nav-dot" *ngFor="let project of projects; let i = index" [class.active]="activeProject === i" (click)="activeProject = i" [attr.aria-label]="'View ' + project.title"></button>
    </div>
  </div>
</section>
